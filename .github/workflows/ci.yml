name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The desktop suite takes ~14 min on a quick runner and over 28 on a slow one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Phones run alongside the desktop suite so neither waits for the other.
  phones:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --project=android --project=iphone

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-phones
          path: playwright-report/
          retention-days: 7
